<app-admin-nav />

<section class="container page">
  @if (loading) {
    <div class="dash-loading">Loading dashboard…</div>
  } @else {
    <div class="dash-header">
      <div>
        <span class="tag">Admin</span>
        <h1>Admin Dashboard</h1>
        <p class="lede">Welcome to ShebaPath CMS</p>
      </div>
      <div class="dash-actions">
        <a routerLink="/admin/guides/new" class="btn btn-primary">+ Guide</a>
        <a routerLink="/admin/blogs/new" class="btn btn-outline">+ Blog</a>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card accent-green">
        <span class="stat-icon">📘</span>
        <span class="stat-label">Total Guides</span>
        <span class="stat-value">{{ stats.totalGuides }}</span>
      </div>

      <div class="stat-card accent-blue">
        <span class="stat-icon">📰</span>
        <span class="stat-label">Total Blogs</span>
        <span class="stat-value">{{ stats.totalBlogs }}</span>
      </div>

      <div class="stat-card accent-purple">
        <span class="stat-icon">👤</span>
        <span class="stat-label">Total Users</span>
        <span class="stat-value">{{ stats.totalUsers }}</span>
      </div>

      <div class="stat-card accent-red">
        <span class="stat-icon">⭐</span>
        <span class="stat-label">Bookmarks</span>
        <span class="stat-value">{{ stats.totalBookmarks }}</span>
      </div>
    </div>
  }
</section>
