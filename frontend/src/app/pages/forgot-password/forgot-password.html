<section class="container auth-page">
  @if (submitted()) {
    <div class="card auth-card">
      <h1>Check your email</h1>
      <p class="lede">If an account exists for that email, we've generated a password reset link for it.</p>
      <a class="btn btn-outline" routerLink="/login">Back to login</a>
    </div>
  } @else {
    <div class="card auth-card">
      <h1>Forgot your password?</h1>
      <p class="lede">Enter your email and we'll help you reset it.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
        <button class="btn btn-primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
      <p class="switch-link"><a routerLink="/login">Back to login</a></p>
    </div>
  }
</section>
