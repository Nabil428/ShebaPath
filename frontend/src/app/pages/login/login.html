<section class="container auth-page">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="lede">Log in to track your applications and save guides.</p>

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary full" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="switch"><a routerLink="/forgot-password">Forgot password?</a></p>
    <p class="switch">No account yet? <a routerLink="/register">Register here</a></p>
  </div>
</section>
