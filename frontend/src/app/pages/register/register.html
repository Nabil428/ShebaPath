<section class="container auth-page">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="lede">Save time by keeping your details ready for future applications.</p>

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input id="phone" type="tel" formControlName="phone" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        <small>At least 8 characters.</small>
      </div>
      <button class="btn btn-primary full" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</section>
